[build-system]
requires = ["setuptools>=68.0"]
build-backend = "setuptools.build_meta"

[project]
name = "blink-repo"
version = "1.2.0"
description = "A lightweight TUI to scan, search, and manage local git repositories"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "prompt-toolkit>=3.0,<4.0",
    "click>=8.0,<9.0",
    "pyyaml>=6.0",
]

[project.scripts]
blink = "blink.cli:main"

[project.urls]
Homepage = "https://github.com/russell/blink"

[tool.setuptools]
packages = ["blink", "blink.tui", "blink.loop", "blink.loop.runner"]

[tool.setuptools.package-dir]
blink = "src"

[tool.pyrefly]
search_path = ["src/..."]

[tool.pytest.ini_options]
testpaths = ["tests"]

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]
